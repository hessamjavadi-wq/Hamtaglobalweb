name: Deploy to ParsPack FTP

on:
  push:
    branches: [ main ]

jobs:
  web-deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
    - name: Get latest code
      uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install dependencies and build
      run: |
        npm install
        npm run build

    - name: Sync files to FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: 1319070690.cloudylink.com
        username: h435958@hamtaglobal.com
        password: ${{ secrets.FTP_PASSWORD }}
        server-dir: /home/h435958/public_html/
        local-dir: dist/
